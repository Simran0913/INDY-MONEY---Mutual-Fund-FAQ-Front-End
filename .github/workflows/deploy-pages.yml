name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.js"
      - "next.config.mjs"
      - "tsconfig.json"
      - "tailwind.config.*"
      - "postcss.config.*"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect frontend folder and project base path
        shell: bash
        run: |
          if [ -f app/package.json ]; then
            echo "FRONTEND_DIR=app" >> "$GITHUB_ENV"
            echo "PAGES_ARTIFACT_DIR=app/out" >> "$GITHUB_ENV"
          elif [ -f package.json ]; then
            echo "FRONTEND_DIR=." >> "$GITHUB_ENV"
            echo "PAGES_ARTIFACT_DIR=out" >> "$GITHUB_ENV"
          else
            echo "::error::Could not find package.json in the repository root or app/."
            exit 1
          fi

          repo_name="${GITHUB_REPOSITORY#*/}"
          repo_name_lower="$(printf '%s' "$repo_name" | tr '[:upper:]' '[:lower:]')"
          owner_lower="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          if [ "$repo_name_lower" = "$owner_lower.github.io" ]; then
            echo "NEXT_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_BASE_PATH=/$repo_name" >> "$GITHUB_ENV"
          fi

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build static frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          npm run build
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_ARTIFACT_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
